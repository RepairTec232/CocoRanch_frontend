<div
  [ngClass]="appService.getThemeClass('navbar')"
  class="d-flex align-items-center w-100 px-3 py-2 shadow-sm"
>
  <div class="d-flex align-items-center justify-content-start gap-4">
    <div class="navbar-logo">
      <a routerLink="/">
        <img [src]="logoSrc()" alt="Logo" style="height: 50px; width: auto" />
      </a>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button
        class="btn btn-sm text-decoration-none fw-bold px-3 py-2 border-0 shadow-none"
        [ngClass]="appService.getThemeClass('navbar-brand')"
        style="color: #4b5563; transition: all 0.2s"
        routerLink="/dashboard"
        routerLinkActive="bg-primary bg-opacity-10 text-primary rounded-3"
      >
        📋 Órdenes
      </button>

      <button
        class="btn btn-sm text-decoration-none fw-bold px-3 py-2 border-0 shadow-none"
        [ngClass]="appService.getThemeClass('navbar-brand')"
        style="color: #4b5563; transition: all 0.2s"
        routerLink="/estadisticas"
        routerLinkActive="bg-primary bg-opacity-10 text-primary rounded-3"
      >
        📊 Estadísticas
      </button>

      <button
        class="btn btn-sm text-decoration-none fw-bold px-3 py-2 border-0 shadow-none"
        [ngClass]="appService.getThemeClass('navbar-brand')"
        style="color: #4b5563; transition: all 0.2s"
        routerLink="/catalogo"
        routerLinkActive="bg-primary bg-opacity-10 text-primary rounded-3"
      >
        📦 Catálogo
      </button>

      <button
        class="btn btn-sm text-decoration-none fw-bold px-3 py-2 border-0 shadow-none"
        [ngClass]="appService.getThemeClass('navbar-brand')"
        style="color: #4b5563; transition: all 0.2s"
        routerLink="/caja"
        routerLinkActive="bg-primary bg-opacity-10 text-primary rounded-3"
      >
        💵 Caja y Cortes
      </button>
    </div>
  </div>
</div>
