<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">
        <i class="bi bi-file-earmark-plus"></i> Registrar Ingreso de Equipo
      </h4>
    </div>
    <div class="card-body">
      <form [formGroup]="reparacionForm" (ngSubmit)="guardar()">
        <h5 class="text-primary border-bottom pb-2 mb-3">
          1. Datos del Cliente
        </h5>
        <div class="row mb-4">
          <div class="col-md-4">
            <label class="form-label">Teléfono / WhatsApp *</label>
            <div class="input-group">
              <input
                type="text"
                formControlName="telefono"
                class="form-control"
                [ngClass]="{
                  'is-invalid':
                    reparacionForm.get('telefono')?.invalid &&
                    reparacionForm.get('telefono')?.touched,
                }"
                (blur)="buscarCliente()"
                placeholder="Ej. 6671234567"
              />

              <span class="input-group-text" *ngIf="cargandoCliente">
                <span
                  class="spinner-border spinner-border-sm"
                  role="status"
                ></span>
              </span>

              <div class="invalid-feedback">
                Ingresa un número válido de 10 dígitos.
              </div>
            </div>
            <small class="text-success" *ngIf="clienteExiste"
              >¡Cliente frecuente encontrado!</small
            >
          </div>

          <div class="col-md-4">
            <label class="form-label">Nombre Completo *</label>
            <input
              type="text"
              formControlName="nombreCompleto"
              class="form-control"
              [ngClass]="{
                'is-invalid':
                  reparacionForm.get('nombreCompleto')?.invalid &&
                  reparacionForm.get('nombreCompleto')?.touched,
              }"
              [readonly]="clienteExiste"
            />
            <div class="invalid-feedback">
              El nombre completo es obligatorio.
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Correo Electrónico</label>
            <input
              type="email"
              formControlName="email"
              class="form-control"
              [readonly]="clienteExiste"
            />
          </div>
        </div>

        <h5 class="text-primary border-bottom pb-2 mb-3">
          2. Datos del Equipo
        </h5>
        <div class="row mb-4">
          <div class="col-md-3">
            <label class="form-label">Tipo de Equipo *</label>
            <select formControlName="tipoEquipo" class="form-select">
              <option value="CELULAR">Celular</option>
              <option value="COMPUTADORA">Computadora / Laptop</option>
              <option value="CONSOLA">Consola de Videojuegos</option>
              <option value="OTRO">Otro</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Marca *</label>
            <input
              type="text"
              formControlName="marca"
              class="form-control"
              placeholder="Ej. Apple, Nintendo, HP"
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">Modelo *</label>
            <input
              type="text"
              formControlName="modelo"
              class="form-control"
              placeholder="Ej. iPhone 15, Switch, Pavilion"
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">Número de Serie</label>
            <input
              type="text"
              formControlName="numeroSerie"
              class="form-control"
              placeholder="Opcional"
            />
          </div>
        </div>

        <h5 class="text-primary border-bottom pb-2 mb-3">
          3. Detalles de la Falla
        </h5>
        <div class="mb-4">
          <label class="form-label"
            >Falla Reportada / Observaciones de Entrada *</label
          >
          <textarea
            formControlName="fallaReportada"
            class="form-control"
            rows="4"
            placeholder="Describe detalladamente cómo llega el equipo y qué reporta el cliente..."
          ></textarea>
        </div>

        <div class="row mt-4 mb-3 p-3 bg-light rounded border">
          <h5 class="text-primary mb-3">
            <i class="pi pi-dollar"></i> Presupuesto Inicial
          </h5>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold"
              >Costo Estimado de Reparación</label
            >
            <div class="input-group">
              <span class="input-group-text bg-white">$</span>
              <input
                type="number"
                class="form-control"
                formControlName="costoEstimado"
                placeholder="Ej. 1500.00"
              />
            </div>
            <small class="text-muted"
              >Lo que se le cobrará al cliente en total.</small
            >
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold"
              >Anticipo (Abono dejado por el cliente)</label
            >
            <div class="input-group">
              <span class="input-group-text bg-white">$</span>
              <input
                type="number"
                class="form-control"
                formControlName="anticipo"
                placeholder="Ej. 500.00"
              />
            </div>
            <small class="text-muted">Deja en 0 si no dejó anticipo.</small>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button
            type="button"
            class="btn btn-secondary"
            routerLink="/dashboard"
          >
            Cancelar
          </button>

          <button type="submit" class="btn btn-success">
            <i class="bi bi-save"></i> Guardar Registro
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
