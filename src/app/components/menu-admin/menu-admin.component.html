<div class="container-fluid mt-4">
  <h2 class="mb-4">Administración del Menú</h2>

  <div class="row">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0">
            {{ modoEdicion ? "Editar Platillo" : "Nuevo Platillo" }}
          </h5>
        </div>
        <div class="card-body">
          <form #productoForm="ngForm" (ngSubmit)="guardar()">
            <div class="mb-3">
              <label class="form-label fw-bold"
                >Nombre del Platillo <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                name="nombre"
                [(ngModel)]="productoActual.nombre"
                required
                #nombre="ngModel"
                placeholder="Ej. Tacos al Pastor"
              />
              <div
                class="text-danger small mt-1"
                *ngIf="nombre.invalid && nombre.touched"
              >
                El nombre es obligatorio.
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold"
                >Ingredientes / Descripción
                <span class="text-danger">*</span></label
              >
              <textarea
                class="form-control"
                name="descripcion"
                [(ngModel)]="productoActual.descripcion"
                required
                #descripcion="ngModel"
                rows="3"
                placeholder="Ej. Orden de 5 tacos..."
              ></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold"
                >Precio ($) <span class="text-danger">*</span></label
              >
              <input
                type="number"
                class="form-control"
                name="precio"
                [(ngModel)]="productoActual.precio"
                required
                min="1"
                #precio="ngModel"
              />
              <div
                class="text-danger small mt-1"
                *ngIf="precio.invalid && precio.touched"
              >
                Ingresa un precio válido.
              </div>
            </div>

            <div class="d-grid gap-2 mt-4">
              <button
                type="submit"
                class="btn btn-primary fw-bold"
                [disabled]="productoForm.invalid"
              >
                <i class="bi bi-save"></i> Guardar Platillo
              </button>
              <button
                type="button"
                class="btn btn-outline-secondary"
                *ngIf="modoEdicion"
                (click)="cancelarEdicion()"
              >
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let prod of productos">
                <td class="fw-bold">{{ prod.nombre }}</td>
                <td class="text-muted small">{{ prod.descripcion }}</td>
                <td>${{ prod.precio | number: "1.2-2" }}</td>
                <td class="text-end">
                  <button
                    class="btn btn-sm btn-outline-primary me-2"
                    (click)="seleccionarProducto(prod)"
                  >
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button
                    class="btn btn-sm btn-outline-danger"
                    (click)="eliminar(prod.id)"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
