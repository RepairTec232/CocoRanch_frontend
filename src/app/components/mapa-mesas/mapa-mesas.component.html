<div class="container mt-4">
  <h2 class="mb-4">Mapa de Mesas - CocoRanch</h2>

  <div class="row row-cols-1 row-cols-md-4 g-4">
    <div class="col" *ngFor="let mesa of mesas">
      <div
        class="card h-100 text-center shadow-sm card-hover"
        [ngClass]="{
          'bg-success text-white': mesa.estado === 'LIBRE',
          'bg-danger text-white': mesa.estado === 'OCUPADA',
        }"
        (click)="seleccionarMesa(mesa)"
        style="cursor: pointer; min-height: 150px"
      >
        <div class="card-body d-flex flex-column justify-content-center">
          <i class="bi bi-shop h1"></i>
          <h5 class="card-title">Mesa {{ mesa.numero }}</h5>
          <p class="card-text">{{ mesa.estado }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
